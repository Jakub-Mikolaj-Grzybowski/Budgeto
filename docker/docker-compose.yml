services:
  backend-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    deploy:
      replicas: 1
    restart: unless-stopped
    environment:
      ConnectionStrings__BudgetoDb: ${DB_CONNECTION_STRING}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
      ASPNETCORE_ENVIRONMENT: Development
    networks:
      - db-network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    restart: unless-stopped
    depends_on:
      - backend-api
    ports:
      - "3948:3948"
    networks:
      - db-network

networks:
  db-network:
    external: true
    name: db-network
